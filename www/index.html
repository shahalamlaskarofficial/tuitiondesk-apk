    // Circular Attendance Ring Component
    function AttendanceRing({ pct }) {
      const radius = 26;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (pct / 100) * circumference;
      const strokeColor = pct >= 85 ? "#10B981" : pct >= 75 ? "#F59E0B" : "#EF4444";

      return (
        <div className="relative inline-flex items-center justify-center">
          <svg className="w-16 h-16 -rotate-90">
            <circle cx="32" cy="32" r={radius} stroke="#E2E8F0" strokeWidth="6" fill="transparent" />
            <circle
              cx="32" cy="32" r={radius}
              stroke={strokeColor}
              strokeWidth="6"
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              fill="transparent"
              className="transition-all duration-700 ease-out"
            />
          </svg>
          <span className="absolute text-xs font-extrabold text-slate-800">{pct}%</span>
        </div>
      );

        return list.sort((a, b) => getPriority(a) - getPriority(b));

                            const isLatest = idx === selectedStudent.testScores.length - 1;
                            return (
                              <div key={idx} className="flex-1 flex flex-col items-center gap-1.5">
                                <span className={`text-[10px] font-extrabold ${isLatest ? "text-indigo-700" : "text-slate-500"}`}>{t.score}</span>
                                <div
                                  style={{ height: `${Math.max(t.score * 1.25, 18)}px` }}
                                  className={`w-full rounded-t-xl transition-all duration-500 ${isLatest ? "hero-gradient shadow-md shadow-indigo-500/30" : "bg-indigo-100"}`}
                                ></div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="flex justify-between px-1 mt-2.5">
                          {selectedStudent.testScores.map((t, idx) => (
                            <span key={idx} className="flex-1 text-center text-[10px] font-extrabold text-slate-400">{t.test}</span>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          const latest = selectedStudent.testScores[selectedStudent.testScores.length - 1];
                          setWaModal({
                            title: `Share Report • ${selectedStudent.rollNo}`,
                            phone: `91${selectedStudent.parentPhone}`,
                            message: `📊 *Weekly Report Card — ${institution.name}*\nStudent: *${selectedStudent.name}* (${selectedStudent.rollNo})\nTopic: ${latest.topic}\nScore: *${latest.score}/100*\nClass Rank: *#${selectedStudent.rank}*\nAttendance: ${selectedStudent.attendancePct}%`
                          });
                        }}
                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 rounded-2xl text-xs shadow-lg shadow-emerald-600/20 tap-scale"
                      >
                        💬 Share Report Card on WhatsApp
                      </button>
                    </div>
                  )}

                  {/* ---------- TAB 4: OWNER DASHBOARD ---------- */}
                  {activeTab === "owner" && (
                    <div className="space-y-4 animate-enter">
                      {/* Parent Portal Preview Launcher */}
                      <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-3xl flex items-center justify-between gap-3">
                        <div>
                          <h3 className="text-xs font-extrabold text-indigo-950">Parent Portal Simulator</h3>
                          <p className="text-[11px] text-indigo-700 mt-0.5">Preview UPI payment & parent check-in view</p>
                        </div>
                        <button
                          onClick={() => setIsParentPreview(true)}
                          className="hero-gradient text-white text-xs font-extrabold px-3.5 py-2.5 rounded-xl shadow-md shrink-0 tap-scale"
                        >
                          Preview View →
                        </button>
                      </div>

                      {/* Collection Progress Bar */}
                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                        <div className="flex justify-between items-end">
                          <div>
                            <p className="text-[11px] font-bold text-slate-400 uppercase">October Fee Collection</p>
                            <p className="text-xl font-extrabold text-emerald-600 mt-0.5">
                              ₹{(students.filter(s => s.feePaid).reduce((a, b) => a + b.feeAmount, 0) + 28500).toLocaleString("en-IN")}
                            </p>
                          </div>
                          <div className="text-right">
                            <p className="text-[11px] font-bold text-rose-500">Pending: ₹{pendingStudents.reduce((a, b) => a + b.feeAmount, 0).toLocaleString("en-IN")}</p>
                          </div>
                        </div>
                        <div className="w-full h-3 bg-rose-100 rounded-full overflow-hidden">
                          <div className="h-full bg-emerald-500 rounded-full" style={{ width: "76%" }}></div>
                        </div>
                      </div>

                      {/* New Referral Enquiries */}
                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                        <div className="flex items-center justify-between">
                          <h3 className="text-xs font-extrabold text-slate-800 uppercase tracking-wider">New Referral Enquiries</h3>
                          <span className="text-[10px] font-extrabold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full">{referrals.length} Leads</span>
                        </div>
                        {referrals.map(ref => (
                          <div key={ref.id} className="p-3 bg-slate-50 rounded-2xl flex items-center justify-between">
                            <div>
                              <p className="text-xs font-extrabold text-slate-900">{ref.studentName} <span className="text-slate-400 font-semibold">({ref.className})</span></p>
                              <p className="text-[11px] text-slate-500 mt-0.5">Via: {ref.referredBy}</p>
                            </div>
                            <a
                              href={`https://wa.me/91${ref.phone}?text=${encodeURIComponent(`Hello! Calling from ${institution.name} regarding your admission enquiry.`)}`}
                              target="_blank"
                              className="bg-emerald-600 text-white text-[10px] font-extrabold px-3 py-2 rounded-xl tap-scale"
                            >
                              Chat ↗
                            </a>
                          </div>
                        ))}
                      </div>

                      {/* Audit Trail */}
                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-2.5">
                        <h3 className="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Security & Attendance Audit Log</h3>
                        <div className="space-y-2 max-h-44 overflow-y-auto no-scrollbar">
                          {auditLogs.map(log => (
                            <div key={log.id} className="p-2.5 bg-slate-50 rounded-2xl text-xs">
                              <div className="flex justify-between font-bold text-slate-800">
                                <span>{log.action}</span>
                                <span className="text-[10px] text-slate-400 font-medium">{log.timestamp}</span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-0.5">{log.details} • <span className="text-indigo-600 font-semibold">{log.actor}</span></p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>

            {/* ================= BOTTOM FLOATING DOCK ================= */}
            {!showParentPortal ? (
              <nav className="bg-white/95 backdrop-blur-lg border-t border-slate-200/80 px-3 py-2.5 flex justify-around items-center fixed bottom-0 w-full max-w-md z-20 shadow-[0_-8px_25px_rgba(15,23,42,0.06)]">
                {[
                  { id: "fees", label: "Fees", icon: "₹" },
                  { id: "attendance", label: "Attendance", icon: "✓" },
                  { id: "tests", label: "Tests", icon: "📊" },
                  { id: "owner", label: "Owner", icon: "🏢" }
                ].map(tab => {
                  const active = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex flex-col items-center py-1.5 px-4 rounded-2xl transition tap-scale ${active ? "hero-gradient text-white shadow-md shadow-indigo-600/25" : "text-slate-400 font-semibold"}`}
                    >
                      <span className="text-sm font-extrabold">{tab.icon}</span>
                      <span className="text-[10px] font-bold mt-0.5">{tab.label}</span>
                    </button>
                  );
                })}
              </nav>
            ) : (
              <div className="bg-white/95 backdrop-blur-lg border-t border-slate-200 p-3.5 flex justify-between items-center fixed bottom-0 w-full max-w-md z-20">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span className="text-xs text-slate-700 font-bold">{activePortalStudent.parentName}</span>
                </div>
                {userRole === "owner" ? (
                  <button onClick={() => setIsParentPreview(false)} className="text-xs text-indigo-600 font-extrabold">← Back to Owner Tabs</button>
                ) : (
                  <button onClick={() => setAuthStep("login")} className="text-xs text-indigo-600 font-extrabold">Switch Account</button>
                )}
              </div>
            )}

            {/* ================= MODALS ================= */}
            {addStudentModal && (
              <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <form onSubmit={handleAddStudent} className="bg-white w-full max-w-sm rounded-[2rem] p-6 space-y-3.5 shadow-2xl animate-enter">
                  <div className="flex justify-between items-center">
                    <h3 className="text-base font-extrabold text-slate-900">Enroll Student</h3>
                    <span className="text-[10px] bg-indigo-100 text-indigo-700 font-extrabold px-2.5 py-1 rounded-lg">TD-2026-{101 + students.length}</span>
                  </div>
                  <input type="text" required placeholder="Student Full Name" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold" />
                  <select value={newStudent.batch} onChange={e => setNewStudent({...newStudent, batch: e.target.value})} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
                    <option value="Class 10 - Maths & Sci (4 PM)">Class 10 - Maths & Sci (4 PM)</option>
                    <option value="Class 9 - Foundation (5:30 PM)">Class 9 - Foundation (5:30 PM)</option>
                  </select>
                  <input type="text" placeholder="Parent Name" value={newStudent.parentName} onChange={e => setNewStudent({...newStudent, parentName: e.target.value})} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold" />
                  <input type="tel" required placeholder="Parent 10-Digit WhatsApp Phone" value={newStudent.parentPhone} onChange={e => setNewStudent({...newStudent, parentPhone: e.target.value})} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold" />
                  <input type="number" placeholder="Monthly Fee (₹)" value={newStudent.feeAmount} onChange={e => setNewStudent({...newStudent, feeAmount: e.target.value})} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold" />
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setAddStudentModal(false)} className="flex-1 py-3 text-xs font-bold bg-slate-100 text-slate-600 rounded-xl">Cancel</button>
                    <button type="submit" className="flex-1 py-3 text-xs font-extrabold hero-gradient text-white rounded-xl shadow-md">Assign Roll No</button>
                  </div>
                </form>
              </div>
            )}

            {waModal && (
              <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-[2rem] p-6 space-y-4 shadow-2xl animate-enter">
                  <h3 className="text-sm font-extrabold text-slate-900">{waModal.title}</h3>
                  <div className="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl text-xs text-slate-700 whitespace-pre-line leading-relaxed font-medium">
                    {waModal.message}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setWaModal(null)} className="flex-1 py-3 text-xs font-bold bg-slate-100 text-slate-600 rounded-xl">Close</button>
                    <a
                      href={`https://wa.me/${waModal.phone.replace(/[^0-9]/g, "")}?text=${encodeURIComponent(waModal.message)}`}
                      target="_blank"
                      onClick={() => { setWaModal(null); showToast("Opening WhatsApp..."); }}
                      className="flex-1 py-3 text-xs font-extrabold bg-emerald-600 text-white text-center rounded-xl shadow-md"
                    >
                      Send via WhatsApp ↗
                    </a>
                  </div>
                </div>
              </div>
            )}

            {upiModal && (
              <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-[2rem] p-6 space-y-4 shadow-2xl text-center animate-enter">
                  <div className="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-extrabold mx-auto">₹</div>
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">Instant UPI Fee Payment</h3>
                    <p className="text-xs text-slate-500 mt-1">Paying <strong className="text-slate-800">₹{selectedStudent.feeAmount.toLocaleString("en-IN")}</strong> to <strong className="text-indigo-600">{institution.upiId}</strong></p>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {["GPay", "PhonePe", "Paytm"].map(app => (
                      <button
                        key={app}
                        onClick={() => handleMarkFeePaid(selectedStudent.id)}
                        className="py-3.5 border border-slate-200 rounded-2xl text-xs font-extrabold text-slate-800 hover:bg-indigo-50 hover:border-indigo-300 tap-scale"
                      >
                        {app}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setUpiModal(false)} className="w-full py-2 text-xs text-slate-400 font-bold">Cancel</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
