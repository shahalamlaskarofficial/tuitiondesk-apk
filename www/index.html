    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const INITIAL_STUDENTS = [

        attendancePct: 85,
        homework: [
          { id: 201, subject: "Maths", task: "Ex 4.2 Quadratic Equations (Q1-Q8)", done: true },
          { id: 202, subject: "Physics", task: "Light Reflection Numericals Worksheet", done: true },
          { id: 203, subject: "Chemistry", task: "Revise Chemical Reactions Balancing", done: true }
        ],
        testScores: [
          { test: "T1", score: 88, max: 100, topic: "Real Numbers" },
          { test: "T2", score: 90, max: 100, topic: "Polynomials" },
          { test: "T3", score: 85, max: 100, topic: "Light - Reflection" },
          { test: "T4", score: 92, max: 100, topic: "Linear Equations" },
          { test: "T5", score: 94, max: 100, topic: "Acids & Bases" },
          { test: "T6", score: 95, max: 100, topic: "Quadratic Eq." }
        ],
        rank: 1
      },
      {
        id: 3,
        rollNo: "TD-2026-104",
        name: "Rohan Verma",
        batch: "Class 9 - Foundation (5:30 PM)",
        parentName: "Suresh Verma",
        parentPhone: "9876543210",
        feeAmount: 2200,
        dueDate: "10 Oct 2026",
        daysLate: 16,
        feePaid: false,
        attendanceToday: "P",
        parentConfirmation: { status: "Not sure", reason: "Left home early, need confirmation", timestamp: "26 Oct 2026, 1:00 PM", locked: false },
        teacherVerification: { status: "Conflict", verifiedBy: "Pending Verification", timestamp: null },
        attendancePct: 78,
        homework: [
          { id: 301, subject: "Maths", task: "Lines and Angles Theorem Proof", done: false },
          { id: 302, subject: "Science", task: "Atoms & Molecules Valency Chart", done: false }
        ],
        testScores: [
          { test: "T1", score: 62, max: 100, topic: "Number System" },
          { test: "T2", score: 65, max: 100, topic: "Motion" },
          { test: "T3", score: 60, max: 100, topic: "Matter Around Us" },
          { test: "T4", score: 68, max: 100, topic: "Force & Laws" },
          { test: "T5", score: 72, max: 100, topic: "Triangles" },
          { test: "T6", score: 75, max: 100, topic: "Gravitation" }
        ],
        rank: 5
      }
    ];

    const INITIAL_REFERRALS = [
      { id: 1, studentName: "Vivaan Kulkarni", className: "Class 10", referredBy: "Aarav Patel (Parent)", phone: "9823019283", status: "New" },
      { id: 2, studentName: "Sneha Deshmukh", className: "Class 9", referredBy: "Ananya Iyer", phone: "9819283746", status: "Demo Scheduled" }
    ];

    const INITIAL_AUDIT_LOGS = [
      { id: 1, timestamp: "26 Oct 2026, 2:10 PM", actor: "Meena Sharma (Parent)", action: "Parent Confirmation: Absent", details: "[TD-2026-103] Diya Sharma marked Absent. Reason: Fever and mild cold." },
      { id: 2, timestamp: "26 Oct 2026, 3:30 PM", actor: "Rajesh Patel (Parent)", action: "Parent Confirmation: Attended", details: "[TD-2026-101] Aarav Patel marked Attended." }
    ];

    function App() {
      const [authStep, setAuthStep] = useState("login");
      const [userRole, setUserRole] = useState("owner");
      const [institution, setInstitution] = useState({
        name: "Vidya Vihar Coaching Centre",
        city: "Pune",
        upiId: "vidyavihar@okaxis",
        ownerPhone: "9820098200"
      });
      const [otpSent, setOtpSent] = useState(false);
      const [phoneInput, setPhoneInput] = useState("9820111223");
      const [otpInput, setOtpInput] = useState("1234");

      const [activeTab, setActiveTab] = useState("fees");
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [referrals] = useState(INITIAL_REFERRALS);
      const [auditLogs, setAuditLogs] = useState(INITIAL_AUDIT_LOGS);
      const [selectedBatch, setSelectedBatch] = useState("All");
      const [selectedStudentId, setSelectedStudentId] = useState(1);
      
      const [parentPhoneLoggedIn, setParentPhoneLoggedIn] = useState("9820111223");
      const linkedChildren = useMemo(() => {
        if (userRole === "parent") {
          return students.filter(s => s.parentPhone === parentPhoneLoggedIn);
        }
        return students;
      }, [students, userRole, parentPhoneLoggedIn]);
      
      const [activeChildIndex, setActiveChildIndex] = useState(0);
      const currentParentChild = linkedChildren[activeChildIndex] || linkedChildren[0] || students[0];

      const [waModal, setWaModal] = useState(null);
      const [upiModal, setUpiModal] = useState(false);
      const [addStudentModal, setAddStudentModal] = useState(false);
      const [newStudent, setNewStudent] = useState({ name: "", batch: "Class 10 - Maths & Sci (4 PM)", parentName: "", parentPhone: "", feeAmount: 2500 });
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
      };

      const pendingStudents = useMemo(() => students.filter(s => !s.feePaid), [students]);
      const selectedStudent = useMemo(() => students.find(s => s.id === Number(selectedStudentId)) || students[0], [students, selectedStudentId]);

      const filteredAttendanceStudents = useMemo(() => {
        if (selectedBatch === "All") return students;
        return students.filter(s => s.batch === selectedBatch);
      }, [students, selectedBatch]);

      const sortedAttendanceStudents = useMemo(() => {
        const list = [...filteredAttendanceStudents];
        const getPriority = (s) => {
          if (s.teacherVerification.status === "Reported Absent" || s.parentConfirmation.status === "Absent") return 1;
          if (s.teacherVerification.status === "Conflict" || s.parentConfirmation.status === "Not sure") return 2;
          if (s.parentConfirmation.status === "Unconfirmed" || s.teacherVerification.status === "Unconfirmed") return 3;
          return 4;
        };
        return list.sort((a, b) => getPriority(a) - getPriority(b));
      }, [filteredAttendanceStudents]);

      const handleParentAttendanceSubmit = (studentId, status, reason = "") => {
        const target = students.find(s => s.id === studentId);
        if (!target) return;

        const nowStr = "26 Oct 2026, " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        setStudents(prev => prev.map(s => {
          if (s.id === studentId) {
            const newTeacherStatus = status === "Absent" ? "Reported Absent" : (status === "Attended" ? "Teacher Verified" : "Conflict");
            return {
              ...s,
              attendanceToday: status === "Attended" ? "P" : (status === "Absent" ? "A" : s.attendanceToday),
              parentConfirmation: { status, reason, timestamp: nowStr, locked: false },
              teacherVerification: { ...s.teacherVerification, status: newTeacherStatus, verifiedBy: `${s.parentName} (Parent)`, timestamp: nowStr }
            };
          }
          return s;
        }));

        const auditEntry = {
          id: Date.now(),
          timestamp: nowStr,
          actor: `${target.parentName} (Parent)`,
          action: `Parent Confirmation: ${status}`,
          details: `[${target.rollNo}] ${target.name} marked ${status}.${reason ? ` Reason: ${reason}` : ""}`
        };
        setAuditLogs(prev => [auditEntry, ...prev]);
        showToast(`Attendance submitted as "${status}" for ${target.rollNo} ${target.name}!`);
      };

      const handleTeacherVerify = (id, newStatus) => {
        const target = students.find(s => s.id === id);
        if (!target) return;
        const nowStr = "26 Oct 2026, " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        setStudents(prev => prev.map(s => {
          if (s.id === id) {
            return {
              ...s,
              attendanceToday: newStatus.includes("Absent") ? "A" : "P",
              teacherVerification: { status: newStatus, verifiedBy: "Teacher Rajesh", timestamp: nowStr }
            };
          }
          return s;
        }));

        const auditEntry = {
          id: Date.now() + Math.random(),
          timestamp: nowStr,
          actor: "Teacher Rajesh",
          action: `Teacher Verification: ${newStatus}`,
          details: `[${target.rollNo}] ${target.name} updated to ${newStatus}.`
        };
        setAuditLogs(prev => [auditEntry, ...prev]);
        showToast(`Updated ${target.rollNo} ${target.name} to "${newStatus}"`);
      };

      const handleMarkFeePaid = (id) => {
        setStudents(prev => prev.map(s => s.id === id ? { ...s, feePaid: true, daysLate: 0 } : s));
        setUpiModal(false);
        showToast("Payment Successful! Fee status updated.");
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!newStudent.name || !newStudent.parentPhone) return;

        const nextRollNum = 101 + students.length;
        const rollNo = `TD-2026-${nextRollNum}`;

        const created = {
          id: Date.now(),
          rollNo: rollNo,
          name: newStudent.name,
          batch: newStudent.batch,
          parentName: newStudent.parentName || "Parent",
          parentPhone: newStudent.parentPhone,
          feeAmount: Number(newStudent.feeAmount) || 2500,
          dueDate: "05 Nov 2026",
          daysLate: 1,
          feePaid: false,
          attendanceToday: "P",
          parentConfirmation: { status: "Unconfirmed", reason: "", timestamp: null, locked: false },
          teacherVerification: { status: "Unconfirmed", verifiedBy: null, timestamp: null },
          attendancePct: 100,
          homework: [{ id: 901, subject: "Maths", task: "Welcome Assessment Sheet", done: false }],
          testScores: [{ test: "T1", score: 85, max: 100, topic: "Baseline Test" }],
          rank: students.length + 1
        };

        setStudents(prev => [created, ...prev]);
        setAddStudentModal(false);
        setNewStudent({ name: "", batch: "Class 10 - Maths & Sci (4 PM)", parentName: "", parentPhone: "", feeAmount: 2500 });
        showToast(`Registered ${created.name} with Roll No: ${rollNo}!`);
      };

      if (authStep !== "app") {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
              <div className="bg-indigo-600 p-6 text-white">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider bg-indigo-500 px-2.5 py-1 rounded-full">TuitionDesk</span>
                  <span className="text-xs text-indigo-200">Roll No System</span>
                </div>
                <h1 className="text-2xl font-extrabold mt-3">TuitionDesk</h1>
                <p className="text-indigo-100 text-xs mt-1">Coaching Management with Sequential Roll Nos</p>
              </div>

              <div className="p-6">
                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-6">
                  <button
                    onClick={() => { setAuthStep("login"); setUserRole("owner"); setOtpSent(false); setPhoneInput("9820098200"); }}
                    className={`py-2.5 text-xs font-bold rounded-lg transition ${userRole === "owner" && authStep !== "register_inst" ? "bg-white text-indigo-600 shadow-sm" : "text-slate-600"}`}
                  >
                    👨‍🏫 Tuition Owner
                  </button>
                  <button
                    onClick={() => { setAuthStep("login"); setUserRole("parent"); setOtpSent(false); setPhoneInput("9820111223"); }}
                    className={`py-2.5 text-xs font-bold rounded-lg transition ${userRole === "parent" ? "bg-white text-indigo-600 shadow-sm" : "text-slate-600"}`}
                  >
                    👪 Parent Portal
                  </button>
                </div>

                {authStep === "register_inst" ? (
                  <div className="space-y-4">
                    <h2 className="text-base font-bold text-slate-800">Register New Tuition Centre</h2>
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Institution Name</label>
                      <input type="text" value={institution.name} onChange={e => setInstitution({...institution, name: e.target.value})} className="w-full mt-1 px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-slate-600">City</label>
                        <input type="text" value={institution.city} onChange={e => setInstitution({...institution, city: e.target.value})} className="w-full mt-1 px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Owner Phone</label>
                        <input type="text" value={institution.ownerPhone} onChange={e => setInstitution({...institution, ownerPhone: e.target.value})} className="w-full mt-1 px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm" />
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Merchant UPI ID</label>
                      <input type="text" value={institution.upiId} onChange={e => setInstitution({...institution, upiId: e.target.value})} className="w-full mt-1 px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <button onClick={() => { setUserRole("owner"); setActiveTab("fees"); setAuthStep("app"); showToast(`Registered ${institution.name}!`); }} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm shadow-md">
                      Complete Setup & Launch →
                    </button>
                    <button onClick={() => setAuthStep("login")} className="w-full text-center text-xs text-slate-500 font-medium py-1">← Back to Login</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-900">
                      {userRole === "owner" ? (
                        <span><strong>Owner Mode:</strong> Manage Roll Nos, Fees, Attendance, and Audit Logs.</span>
                      ) : (
                        <span><strong>Parent Mode:</strong> Test with <strong>9820111223</strong> (Aarav & Riya linked).</span>
                      )}
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-slate-600">10-Digit Mobile Number</label>
                      <div className="flex mt-1">
                        <span className="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-slate-300 bg-slate-50 text-slate-600 text-sm font-semibold">+91</span>
                        <input type="tel" value={phoneInput} onChange={e => setPhoneInput(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-r-xl text-sm font-medium" />
                      </div>
                    </div>

                    {otpSent && (
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Enter 4-Digit OTP</label>
                        <input type="text" value={otpInput} onChange={e => setOtpInput(e.target.value)} className="w-full mt-1 px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm font-bold tracking-widest text-center" />
                      </div>
                    )}

                    {!otpSent ? (
                      <button onClick={() => setOtpSent(true)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm shadow-md">Send OTP via WhatsApp / SMS</button>
                    ) : (
                      <button
                        onClick={() => {
                          if (userRole === "parent") {
                            const trimmedPhone = phoneInput.trim();
                            const matchedChildren = students.filter(s => s.parentPhone === trimmedPhone);
                            if (matchedChildren.length > 0) {
                              setParentPhoneLoggedIn(trimmedPhone);
                              setActiveChildIndex(0);
                              setActiveTab("parent");
                            } else {
                              setParentPhoneLoggedIn("9820111223");
                              setActiveTab("parent");
                            }
                          } else {
                            setActiveTab("fees");
                          }
                          setAuthStep("app");
                        }}
                        className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm shadow-md"
                      >
                        Verify OTP & Enter App →
                      </button>
                    )}

                    {userRole === "owner" && (
                      <div className="pt-3 border-t border-slate-100 text-center">
                        <button onClick={() => setAuthStep("register_inst")} className="text-xs font-bold text-indigo-600 hover:underline">+ New Client? Register Your Tuition Centre</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 flex justify-center">
          <div className="w-full max-w-md bg-slate-50 min-h-screen flex flex-col justify-between relative shadow-2xl">
            <header className="bg-indigo-600 text-white px-4 pt-4 pb-3 sticky top-0 z-20 shadow-md">
              <div className="flex items-center justify-between">
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg font-extrabold tracking-tight">{institution.name}</h1>
                    <span className="text-[10px] bg-indigo-800 px-2 py-0.5 rounded-full font-semibold">{userRole === "owner" ? "ADMIN" : "PARENT"}</span>
                  </div>
                  <p className="text-[11px] text-indigo-200">{institution.city} • UPI: {institution.upiId}</p>
                </div>
                <div className="flex items-center gap-1.5">
                  {userRole === "owner" && (
                    <button onClick={() => setAddStudentModal(true)} className="bg-white/15 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">+ Student</button>
                  )}
                  <button onClick={() => { setOtpSent(false); setAuthStep("login"); }} className="bg-indigo-800 text-indigo-100 text-xs font-semibold px-2.5 py-1.5 rounded-lg">Switch Role</button>
                </div>
              </div>
            </header>

            {toast && (
              <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl border border-slate-700">✅ {toast}</div>
            )}

            <main className="flex-1 p-4 pb-24 overflow-y-auto space-y-4">
              {activeTab === "fees" && (
                <div className="space-y-4">
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Total Pending Fees</p>
                      <p className="text-2xl font-extrabold text-rose-600">₹{pendingStudents.reduce((acc, s) => acc + s.feeAmount, 0).toLocaleString("en-IN")}</p>
                      <p className="text-[11px] text-slate-400 mt-0.5">{pendingStudents.length} students overdue</p>
                    </div>
                    <button
                      onClick={() => setWaModal({
                        title: `Bulk Fee Reminder (${pendingStudents.length} Parents)`,
                        phone: "All Overdue Parents",
                        message: `Dear Parent, gentle reminder from *${institution.name}*. Tuition fee is overdue. Pay via UPI to *${institution.upiId}*.`
                      })}
                      className="bg-emerald-600 text-white text-xs font-bold px-3.5 py-3 rounded-xl shadow-md"
                    >
                      💬 Remind All ({pendingStudents.length})
                    </button>
                  </div>

                  <div className="space-y-2.5">
                    {students.map(student => (
                      <div key={student.id} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md">{student.rollNo}</span>
                            <p className="font-bold text-slate-800 text-sm">{student.name}</p>
                            {student.feePaid ? (
                              <span className="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">PAID</span>
                            ) : (
                              <span className="text-[10px] font-bold bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">{student.daysLate}d late</span>
                            )}
                          </div>
                          <p className="text-xs text-slate-500 mt-0.5">{student.batch}</p>
                          <p className="text-[11px] text-slate-400 mt-0.5">Parent: {student.parentName} (+91 {student.parentPhone})</p>
                        </div>
                        <div className="text-right flex flex-col items-end gap-1.5">
                          <p className="font-extrabold text-slate-900 text-sm">₹{student.feeAmount.toLocaleString("en-IN")}</p>
                          {!student.feePaid && (
                            <div className="flex gap-1">
                              <button onClick={() => handleMarkFeePaid(student.id)} className="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-1 rounded-lg">Mark Paid</button>
                              <button
                                onClick={() => setWaModal({
                                  title: `Fee Reminder (${student.rollNo})`,
                                  phone: `91${student.parentPhone}`,
                                  message: `Namaste ${student.parentName} ji, reminder from *${institution.name}*. Roll No: *${student.rollNo}* (${student.name}) fee of *₹${student.feeAmount}* is pending. UPI: ${institution.upiId}`
                                })}
                                className="text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-lg"
                              >
                                WhatsApp
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === "attendance" && (
                <div className="space-y-4">
                  <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-700">Attendance Exception Board</span>
                      <span className="text-xs font-semibold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg">26 Oct 2026</span>
                    </div>
                    <select value={selectedBatch} onChange={e => setSelectedBatch(e.target.value)} className="w-full text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                      <option value="All">All Batches ({students.length} Students)</option>
                      <option value="Class 10 - Maths & Sci (4 PM)">Class 10 - Maths & Sci (4 PM)</option>
                      <option value="Class 9 - Foundation (5:30 PM)">Class 9 - Foundation (5:30 PM)</option>
                    </select>
                  </div>

                  <div className="space-y-2.5">
                    {sortedAttendanceStudents.map(student => {
                      const pStatus = student.parentConfirmation.status;
                      const tStatus = student.teacherVerification.status;
                      let badgeColor = "bg-slate-100 text-slate-700";
                      if (pStatus === "Attended" && tStatus === "Teacher Verified") badgeColor = "bg-emerald-100 text-emerald-800";
                      else if (pStatus === "Absent" || tStatus === "Reported Absent") badgeColor = "bg-rose-100 text-rose-800";
                      else if (pStatus === "Not sure" || tStatus === "Conflict") badgeColor = "bg-amber-100 text-amber-800";

                      return (
                        <div key={student.id} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                          <div className="flex items-center justify-between">
                            <div>
                              <div className="flex flex-wrap items-center gap-1.5">
                                <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md">{student.rollNo}</span>
                                <p className="font-bold text-slate-800 text-sm">{student.name}</p>
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}`}>Parent: {pStatus}</span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-0.5">{student.batch.split("(")[0]}</p>
                              {student.parentConfirmation.reason && (
                                <p className="text-[11px] text-rose-600 font-medium italic mt-0.5">Reason: "{student.parentConfirmation.reason}"</p>
                              )}
                            </div>
                            <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">{tStatus}</span>
                          </div>
                          <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span className="text-[11px] text-slate-400">Verify:</span>
                            <div className="flex gap-1.5">
                              <button onClick={() => handleTeacherVerify(student.id, "Teacher Verified")} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${tStatus === "Teacher Verified" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-700"}`}>Present</button>
                              <button onClick={() => handleTeacherVerify(student.id, "Reported Absent")} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${tStatus === "Reported Absent" ? "bg-rose-600 text-white" : "bg-slate-100 text-slate-700"}`}>Absent</button>
                              <button onClick={() => handleTeacherVerify(student.id, "Conflict")} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${tStatus === "Conflict" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-700"}`}>Conflict</button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === "tests" && (
                <div className="space-y-4">
                  <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
                    <label className="text-[11px] font-bold text-slate-400 uppercase">Select Student</label>
                    <select value={selectedStudent.id} onChange={e => setSelectedStudentId(Number(e.target.value))} className="w-full mt-1 text-sm font-bold bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                      {students.map(s => <option key={s.id} value={s.id}>[{s.rollNo}] {s.name} — {s.batch.split("(")[0]}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                      <p className="text-xs text-slate-400 font-medium">Latest Score ({selectedStudent.rollNo})</p>
                      <p className="text-2xl font-extrabold text-indigo-600 mt-1">{selectedStudent.testScores[selectedStudent.testScores.length - 1].score}/100</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                      <p className="text-xs text-slate-400 font-medium">Batch Rank</p>
                      <p className="text-2xl font-extrabold text-amber-500 mt-1">#{selectedStudent.rank}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <h3 className="text-xs font-bold text-slate-700 mb-4">Last 6 Weekly Tests</h3>
                    <div className="h-40 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-100">
                      {selectedStudent.testScores.map((t, idx) => (
                        <div key={idx} className="flex-1 flex flex-col items-center gap-1">
                          <span className="text-[10px] font-bold text-slate-600">{t.score}%</span>
                          <div style={{ height: `${Math.max(t.score * 1.1, 16)}px` }} className={`w-full rounded-t-lg ${idx === selectedStudent.testScores.length - 1 ? "bg-indigo-600" : "bg-indigo-200"}`}></div>
                        </div>
                      ))}
                    </div>
                    <div className="flex justify-between px-2 mt-2">
                      {selectedStudent.testScores.map((t, idx) => <span key={idx} className="flex-1 text-center text-[10px] font-semibold text-slate-400">{t.test}</span>)}
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      const latest = selectedStudent.testScores[selectedStudent.testScores.length - 1];
                      setWaModal({
                        title: `Share Report Card (${selectedStudent.rollNo})`,
                        phone: `91${selectedStudent.parentPhone}`,
                        message: `📊 *Weekly Test Report — ${institution.name}*\nStudent: *${selectedStudent.name}* (Roll: ${selectedStudent.rollNo})\nScore: *${latest.score}/100*\nRank: *#${selectedStudent.rank}*`
                      });
                    }}
                    className="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-2xl text-sm shadow-lg"
                  >
                    💬 Share Progress Report on WhatsApp
                  </button>
                </div>
              )}

              {activeTab === "parent" && (
                <div className="space-y-4">
                  {linkedChildren.length > 1 && (
                    <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-2xl space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold uppercase text-indigo-700">Linked Family Sibling Portal</span>
                        <span className="text-[10px] bg-indigo-600 text-white font-bold px-2 py-0.5 rounded-full">{linkedChildren.length} Kids</span>
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        {linkedChildren.map((child, idx) => (
                          <button
                            key={child.id}
                            onClick={() => setActiveChildIndex(idx)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${activeChildIndex === idx ? "bg-indigo-600 text-white shadow" : "bg-white text-indigo-700 border border-indigo-200"}`}
                          >
                            <span>{child.name.split(" ")[0]}</span>
                            <span className={`text-[9px] px-1.5 rounded ${activeChildIndex === idx ? "bg-indigo-700 text-indigo-100" : "bg-slate-100 text-slate-600"}`}>{child.rollNo}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {userRole === "owner" && (
                    <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl flex items-center justify-between">
                      <span className="text-xs font-semibold text-amber-900">Admin Preview:</span>
                      <select value={selectedStudent.id} onChange={e => setSelectedStudentId(Number(e.target.value))} className="text-xs font-bold bg-white border border-amber-300 rounded-lg px-2 py-1">
                        {students.map(s => <option key={s.id} value={s.id}>[{s.rollNo}] {s.name}</option>)}
                      </select>
                    </div>
                  )}

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex justify-between items-start">
                      <div>
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md">{userRole === "parent" ? currentParentChild.rollNo : selectedStudent.rollNo}</span>
                          <h2 className="text-base font-extrabold text-slate-800">{userRole === "parent" ? currentParentChild.name : selectedStudent.name}</h2>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">{userRole === "parent" ? currentParentChild.batch : selectedStudent.batch}</p>
                      </div>
                      <span className="bg-emerald-50 text-emerald-700 font-bold text-xs px-2.5 py-1 rounded-full">{userRole === "parent" ? currentParentChild.attendancePct : selectedStudent.attendancePct}%</span>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                      <div>
                        <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Today's Session Confirmation</h3>
                        <p className="text-[11px] text-slate-500 mt-0.5">26 Oct 2026</p>
                      </div>
                      <span className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                        {userRole === "parent" ? currentParentChild.parentConfirmation.status : selectedStudent.parentConfirmation.status}
                      </span>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      {["Attended", "Absent", "Not sure"].map(opt => {
                        const targetChild = userRole === "parent" ? currentParentChild : selectedStudent;
                        const isSelected = targetChild.parentConfirmation.status === opt;
                        return (
                          <button
                            key={opt}
                            onClick={() => handleParentAttendanceSubmit(targetChild.id, opt, targetChild.parentConfirmation.reason)}
                            className={`py-3 px-2 rounded-xl text-xs font-bold transition ${
                              isSelected ? (opt === "Attended" ? "bg-emerald-600 text-white" : opt === "Absent" ? "bg-rose-600 text-white" : "bg-amber-600 text-white") : "bg-slate-100 text-slate-700"
                            }`}
                          >
                            {opt === "Attended" ? "✓ Attended" : opt === "Absent" ? "✕ Absent" : "? Not Sure"}
                          </button>
                        );
                      })}
                    </div>

                    <input
                      type="text"
                      placeholder="Optional reason (e.g. unwell)..."
                      value={userRole === "parent" ? currentParentChild.parentConfirmation.reason : selectedStudent.parentConfirmation.reason}
                      onChange={e => {
                        const targetId = userRole === "parent" ? currentParentChild.id : selectedStudent.id;
                        const val = e.target.value;
                        setStudents(prev => prev.map(s => s.id === targetId ? { ...s, parentConfirmation: { ...s.parentConfirmation, reason: val } } : s));
                      }}
                      className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5"
                    />
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-400 font-medium">Monthly Tuition Fee</p>
                      <p className="text-xl font-extrabold text-slate-900 mt-0.5">₹{(userRole === "parent" ? currentParentChild.feeAmount : selectedStudent.feeAmount).toLocaleString("en-IN")}</p>
                    </div>
                    {(userRole === "parent" ? currentParentChild.feePaid : selectedStudent.feePaid) ? (
                      <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-3.5 py-2 rounded-xl">✅ Fee Paid</span>
                    ) : (
                      <button
                        onClick={() => {
                          if (userRole === "parent") setSelectedStudentId(currentParentChild.id);
                          setUpiModal(true);
                        }}
                        className="bg-indigo-600 text-white font-bold text-xs px-4 py-3 rounded-xl shadow-md"
                      >
                        Pay by UPI →
                      </button>
                    )}
                  </div>
                </div>
              )}

              {activeTab === "owner" && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                      <p className="text-xs text-slate-400 font-medium">Collected (Oct)</p>
                      <p className="text-xl font-extrabold text-emerald-600 mt-1">₹{(students.filter(s => s.feePaid).reduce((a, b) => a + b.feeAmount, 0) + 28500).toLocaleString("en-IN")}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                      <p className="text-xs text-slate-400 font-medium">Pending Fees</p>
                      <p className="text-xl font-extrabold text-rose-600 mt-1">₹{pendingStudents.reduce((a, b) => a + b.feeAmount, 0).toLocaleString("en-IN")}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <h3 className="text-xs font-bold text-slate-700 uppercase">Attendance & Roll No Audit Trail</h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {auditLogs.map(log => (
                        <div key={log.id} className="p-2.5 bg-slate-50 rounded-xl text-xs space-y-0.5">
                          <div className="flex justify-between font-bold text-slate-800">
                            <span>{log.action}</span>
                            <span className="text-[10px] text-slate-400 font-normal">{log.timestamp}</span>
                          </div>
                          <p className="text-[11px] text-slate-600">{log.details}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </main>

            {userRole === "owner" ? (
              <nav className="bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center fixed bottom-0 w-full max-w-md z-20">
                {[
                  { id: "fees", label: "Fees", icon: "₹" },
                  { id: "attendance", label: "Attendance", icon: "✓" },
                  { id: "tests", label: "Tests", icon: "📊" },
                  { id: "parent", label: "Parent View", icon: "👪" },
                  { id: "owner", label: "Owner", icon: "🏢" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition ${activeTab === tab.id ? "text-indigo-600 font-bold bg-indigo-50" : "text-slate-400 font-medium"}`}
                  >
                    <span className="text-base">{tab.icon}</span>
                    <span className="text-[10px] mt-0.5">{tab.label}</span>
                  </button>
                ))}
              </nav>
            ) : (
              <div className="bg-white border-t border-slate-200 p-3 flex justify-between items-center fixed bottom-0 w-full max-w-md z-20">
                <span className="text-xs text-slate-600 font-medium">Parent: <strong>{currentParentChild.parentName}</strong></span>
                <button onClick={() => setAuthStep("login")} className="text-xs text-indigo-600 font-bold underline">Switch Account</button>
              </div>
            )}

            {addStudentModal && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <form onSubmit={handleAddStudent} className="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-extrabold text-slate-800">Add New Student</h3>
                    <span className="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded">Assigned: TD-2026-{101 + students.length}</span>
                  </div>
                  <input type="text" required placeholder="Student Full Name" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  <input type="text" placeholder="Parent Name" value={newStudent.parentName} onChange={e => setNewStudent({...newStudent, parentName: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  <input type="tel" required placeholder="Parent 10-Digit WhatsApp Phone" value={newStudent.parentPhone} onChange={e => setNewStudent({...newStudent, parentPhone: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  <input type="number" placeholder="Monthly Fee (₹)" value={newStudent.feeAmount} onChange={e => setNewStudent({...newStudent, feeAmount: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setAddStudentModal(false)} className="flex-1 py-2.5 text-xs font-bold bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" className="flex-1 py-2.5 text-xs font-bold bg-indigo-600 text-white rounded-xl">Register</button>
                  </div>
                </form>
              </div>
            )}

            {waModal && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl">
                  <h3 className="text-sm font-extrabold text-slate-800">{waModal.title}</h3>
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs text-slate-700 whitespace-pre-line">{waModal.message}</div>
                  <div className="flex gap-2 pt-1">
                    <button onClick={() => setWaModal(null)} className="flex-1 py-2.5 text-xs font-bold bg-slate-100 rounded-xl">Close</button>
                    <a href={`https://wa.me/${waModal.phone.replace(/[^0-9]/g, "")}?text=${encodeURIComponent(waModal.message)}`} target="_blank" onClick={() => setWaModal(null)} className="flex-1 py-2.5 text-xs font-bold bg-emerald-600 text-white text-center rounded-xl">Open WhatsApp ↗</a>
                  </div>
                </div>
              </div>
            )}

            {upiModal && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl text-center">
                  <h3 className="text-sm font-extrabold text-slate-800">Pay Fee via UPI</h3>
                  <p className="text-xs text-slate-500">Paying <strong>₹{selectedStudent.feeAmount}</strong> to <strong>{institution.upiId}</strong></p>
                  <div className="grid grid-cols-3 gap-2">
                    {["GPay", "PhonePe", "Paytm"].map(app => (
                      <button key={app} onClick={() => handleMarkFeePaid(selectedStudent.id)} className="py-3 border border-slate-200 rounded-xl text-xs font-bold hover:bg-indigo-50">{app}</button>
                    ))}
                  </div>
                  <button onClick={() => setUpiModal(false)} className="w-full py-2 text-xs text-slate-400 font-semibold">Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
